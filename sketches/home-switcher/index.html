<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell — Home Page Sketches</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#eee}
header{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:8px;align-items:center;padding:10px 16px;background:rgba(17,17,17,.92);backdrop-filter:blur(6px);border-bottom:1px solid #333}
header b{font-size:13px;margin-right:8px;letter-spacing:.04em}
header a{font-size:12.5px;padding:6px 14px;border:1px solid #444;border-radius:999px;color:#ccc;text-decoration:none;cursor:pointer}
header a.on{background:#38a6cf;border-color:#38a6cf;color:#111;font-weight:600}
header a:hover:not(.on){border-color:#888;color:#fff}
iframe{position:fixed;top:53px;left:0;right:0;bottom:0;width:100%;border:none;background:#191817}
</style>
</head>
<body>
<header>
  <b>INKWELL · HOME SKETCHES</b>
  <a class="on" data-src="007-desk-broadsheet/index.html" onclick="pick(this)">007 Desk Broadsheet</a>
  <a data-src="008-quiet-focus/index.html" onclick="pick(this)">008 Quiet Focus</a>
  <a data-src="009-console/index.html" onclick="pick(this)">009 Console</a>
  <span style="flex:1"></span>
  <a data-src="" onclick="toggleLight(this)" id="lightbtn">☀ try light mode</a>
</header>
<iframe id="frame" src="007-desk-broadsheet/index.html"></iframe>
<script>
const frame=document.getElementById('frame');
let dark=true;
function pick(el){
  document.querySelectorAll('header a[data-src]').forEach(a=>a.classList.remove('on'));
  el.classList.add('on');
  frame.src=el.dataset.src+(dark?'':'?mode=light');
}
function toggleLight(el){
  dark=!dark;
  el.textContent=dark?'☀ try light mode':'☾ back to dark';
  const on=document.querySelector('header a.on');
  frame.src=on.dataset.src+(dark?'':'?mode=light');
}
</script>
</body>
</html>
